{% set name = "pydantic-extra-types" %}
{% set version = "2.11.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 3a2b83b61fe920925688e7838b59caa90a45637d1dbba2b1364b8d1f7ff72a0a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - pydantic >=2.5.2
    - typing_extensions
  run_constrained:
    - pendulum >=3.0.0,<4.0.0
    - phonenumbers >=8,<10
    - pycountry >=23
    - python-ulid >=1,<2  # [py<39]
    - python-ulid >=1,<4  # [py>=39]
    - semver >=3.0.2,<3.1.0
    - pymongo >=4.0.0,<5.0.0
    - pytz >=2024.1
    - python-tzdata >=2024.1
    - tzdata >=2024.1
    - cron-converter >=1.2.2
    - jsonschema >=4.0.0
    - uuid-utils  # [py<314]

{% set tests_to_ignore = "--ignore=tests/test_ulid.py" %}  # missing python-ulid
{% set tests_to_ignore = tests_to_ignore + " --ignore=tests/test_json_schema.py" %}  # cron-converter / schema extras
{% set tests_to_ignore = tests_to_ignore + " --ignore=tests/test_cron.py" %}  # requires cron-converter
{% set tests_to_ignore = tests_to_ignore + " --deselect=tests/test_coordinate.py::test_json_schema" %}  # schema shape vs pydantic on main

test:
  source_files:
    - tests
  imports:
    - pydantic_extra_types
  requires:
    - pytest
    - pip
    - pytz
    - semver
    - phonenumbers
    # pendulum 3.1.0 doesn't support py314. Re-enable when pendulum 3.2.0+ is released.
    - pendulum  # [py<314]
    - pymongo
    - pycountry
    - uuid-utils  # [py<314]
  commands:
    - pip check
    - pytest -v {{ tests_to_ignore }} tests  # [py<314]
    # pendulum 3.1.0 doesn't support py314
    - pytest -v {{ tests_to_ignore }} --ignore=tests/test_pendulum_dt.py tests  # [py==314]

about:
  home: https://github.com/pydantic/pydantic-extra-types
  dev_url: https://github.com/pydantic/pydantic-extra-types
  doc_url: https://docs.pydantic.dev
  summary: Extra Pydantic types.
  description: A place for pydantic types that probably shouldn't exist in the main pydantic lib.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - PatrykKups
